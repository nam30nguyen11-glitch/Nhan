<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TeleSale - Task đăng đánh giá</title>
<style>
:root{--card:#fff;--tx:#3d3340;--mu:#8b7f90;--bd:#efe4ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(160deg,#fdf5ea 0%,#f9eef3 50%,#e9f0fb 100%) fixed;min-height:100vh;padding-bottom:40px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#fbe3c8,#f6d5e4 55%,#d9e6fa);color:#5b4636;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 12px;box-shadow:0 3px 14px rgba(150,120,150,.15)}
.top h1{margin:0 0 8px;font-size:17px}
.map{display:block;text-align:center;text-decoration:none;min-height:44px;line-height:44px;border-radius:12px;background:linear-gradient(120deg,#f6c9a4,#eeb0c8);color:#4a3426;font-weight:700;font-size:15px;box-shadow:0 2px 8px rgba(200,130,140,.25)}
main{padding:12px;max-width:760px;margin:0 auto}
.t{background:rgba(255,255,255,.9);border:1px solid #f0e6ee;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px rgba(140,110,150,.07)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--mu);margin-bottom:6px}
.chip{background:linear-gradient(120deg,#fde7cf,#fadbe8);color:#6b4a3a;border:1px solid #f1d2d9;border-radius:20px;padding:2px 10px;font-weight:700;font-size:13px}
.sb{border-radius:8px;padding:1px 8px;font-size:13px;font-weight:700;background:#fff6dc;color:#8a6a1a;border:1px solid #f3e1ab}
.tx{margin:0 0 10px;user-select:text}
.cp{width:100%;min-height:44px;border:0;border-radius:10px;font-size:14px;font-weight:700;background:linear-gradient(120deg,#f6d3b4,#f0bdd0);color:#5a3a2c}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3d3340;color:#fff;padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.s{opacity:1}
@media (prefers-color-scheme:dark){
:root{--card:#1f2333;--tx:#ece6ef;--mu:#a69fb3;--bd:#2d3248}
body{background:linear-gradient(160deg,#171a27,#1d1a29,#151f31) fixed}
.top{background:linear-gradient(120deg,#4a3b36,#463349,#2f3d58);color:#f3e9e1}
.t{background:var(--card);border-color:var(--bd);box-shadow:none}
.chip{background:linear-gradient(120deg,#5a4540,#5a4256);color:#f6e8df;border-color:#6d5560}
.sb{background:#3a3326;color:#f0d9a0;border-color:#574a2e}
}
</style>
</head>
<body>
<div class="top">
  <h1>📞 TeleSale</h1>
  <a class="map" href="https://g.page/r/CRUZjG1bWyMOEAI/review" target="_blank" rel="noopener">📍 Click Maps đánh giá</a>
</div>
<main id="list"></main>
<div class="toast" id="toast"></div>
<script>
var CS=["Các bạn tư vấn viên nói chuyện nhẹ nhàng, giải thích cặn kẽ từng hạng mục trong hợp đồng trước khi mình ký.","Mình mua gói chăm sóc da cơ bản bên này, giá hợp lý mà không gian riêng tư, yên tĩnh để nghỉ ngơi cuối tuần.","Bạn mình làm mũi ở đây đẹp quá nên giới thiệu mình qua. Trải nghiệm thực tế thấy đúng như lời đồn, rất chuyên nghiệp.","Mình tìm hiểu rất kỹ về an toàn gây mê trước khi làm ngực. Bên Nam An có ekip bác sĩ gây mê hồi sức riêng nên mình hoàn toàn an tâm.","Tư vấn kỹ, bác sĩ thân thiện. Mình chỉ góp ý xíu là bãi đậu ô tô giờ cao điểm hơi chật, còn lại mọi thứ đều ổn.","Làm nâng cơ trẻ hóa xong thấy vùng rãnh cười mờ đi rõ rệt, mặt gọn hơn mà không cần nghỉ dưỡng gì cả.","Mở góc mắt trong kết hợp cắt mí, lúc đầu cũng hơi lo nhưng bác sĩ làm nhẹ nhàng, tiêm tê chỉ hơi nhói xíu lúc đầu thôi.","Mình ở tỉnh lên làm dịch vụ, được bệnh viện hỗ trợ chỗ nghỉ ngơi hậu phẫu sạch sẽ, có điều dưỡng trực theo dõi xuyên đêm.","Điều trị sẹo rỗ tới buổi thứ 3 thấy bề mặt da phẳng và mịn hơn nhiều rồi, lỗ chân lông cũng thu nhỏ lại.","Cơ sở vật chất chuẩn bệnh viện nên từ phòng khám tới phòng tiểu phẫu đều vô trùng kỹ lưỡng, nhìn rất an tâm.","Sửa lại mũi hỏng từ chỗ cũ qua bên Nam An. May gặp đúng bác sĩ có tâm, xử lý lại phần sụn rất khéo, giờ mũi đã ổn định.","Thích cách làm việc ở đây là không chèo kéo nâng gói dịch vụ. Mình hỏi gói nào bác sĩ tư vấn đúng gói đó.","Cuối tuần ghé điện di tinh chất thư giãn, nhân viên không nói chuyện riêng ồn ào trong phòng nên ngủ một giấc rất ngon.","Khám sức khỏe tổng quát trước phẫu thuật làm rất bài bản, có kết quả đầy đủ bác sĩ mới duyệt cho lên phòng mổ.","Tiêm filler cằm tạo dáng V-line nhẹ nhàng, bác sĩ nắn chỉnh tỉ mỉ từng chút một nên nhìn tự nhiên lắm.","Nâng cung chân mày cho mẹ mình tuần trước, nay cắt chỉ xong mắt mẹ hết bị sụp da dư, nhìn tươi tắn hẳn.","Dịch vụ xứng đáng với chi phí bỏ ra. Từ khâu đặt lịch online tới lúc tới bệnh viện đều trơn tru.","Hút mỡ bắp tay ở đây được 1 tháng, nay mặc áo sát nách tự tin hẳn, vùng da cánh tay săn chắc không bị lồi lõm.","Bác sĩ giải thích cặn kẽ về cơ địa và tỷ lệ hồi phục của từng người chứ không hứa hẹn suông. Rất tôn trọng sự thật thà này.","Mình quên đồ ở sảnh chờ, liên hệ fanpage là các bạn bảo vệ tìm lại và giữ giúp cẩn thận. Rất cảm ơn bệnh viện."];
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
document.getElementById("list").innerHTML=CS.map(function(t,i){
  return '<div class="t"><div class="meta"><span class="chip">#'+(i+1)+'</span><span class="sb">5 ★ sao</span><span>📵 Tắt wifi bệnh viện hoặc ở nhà</span></div><p class="tx">'+esc(t)+'</p><button class="cp" data-i="'+i+'">📋 Copy nội dung</button></div>';
}).join("");
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("s");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("s")},1400)}
function copyText(tx){
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){toast("Đã copy!")},fb)}else fb();
  function fb(){var a=document.createElement("textarea");a.value=tx;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Đã copy!")}catch(e){toast("Không copy được")}a.remove()}
}
document.getElementById("list").onclick=function(e){var b=e.target.closest(".cp");if(b)copyText(CS[+b.getAttribute("data-i")])};
</script>
</body>
</html>
